# Fail startup if production connection details or secrets have not been supplied.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
server.forward-headers-strategy=framework
app.frontend-url=${FRONTEND_URL}
app.jwt.secret=${JWT_SECRET}
app.mail.encryption-key=${MAIL_ENCRYPTION_KEY}
app.brevo.api-key=${BREVO_API_KEY}
app.brevo.sender-email=${BREVO_SENDER_EMAIL}

spring.application.name=MultiRole
spring.config.import=optional:file:./config/application-local.properties,optional:file:./backend/config/application-local.properties
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/ce_system_db?serverTimezone=Asia/Bangkok}
spring.datasource.username=${DB_USERNAME:multirole}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=1440
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.sender-email=${BREVO_SENDER_EMAIL:}
app.brevo.sender-name=MultiRole
app.mail.encryption-key=${MAIL_ENCRYPTION_KEY:${app.jwt.secret}}
app.mail.verification-enabled=true
app.mail.dispatch-enabled=true
app.reminders.enabled=true
app.time-zone=Asia/Bangkok
